# 파일 역할: EC2에서 미리 게시한 BE 이미지를 실행하는 배포용 Compose입니다.
# 로컬 infra/compose.yaml과 별도이며 DB·영상 저장소·AI는 생성하지 않습니다.
# 입력: 서버 shared/api.env와 배포 스크립트가 지정하는 API_IMAGE digest.
services:
  api:
    image: ${API_IMAGE:?Set verified image digest}
    platform: linux/amd64
    restart: unless-stopped
    # 앱 설정은 EC2에 보관합니다. 비밀번호는 GitHub나 이미지에 복사하지 않습니다.
    environment:
      APP_ENV: ${APP_ENV:?Set environment}
      DB_HOST: ${DB_HOST:?Set reachable DB host}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB name}
      DB_USER: ${DB_USER:?Set DB user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB password}
    # 같은 서버의 HTTPS reverse proxy를 통해 공개할 것을 전제로 loopback에만 바인딩합니다.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    # stdout/stderr 로그가 디스크를 무제한 채우지 않도록 회전합니다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
