# 파일 역할: 검증한 BE 이미지를 Amazon ECR private registry에 게시합니다.
# 실행: develop push/수동 실행. ECR_PUBLISH_ENABLED=true 전에는 AWS 게시를 건너뜁니다.
# 흐름: 코드 CI → 계정 설정 확인 → GitHub OIDC 임시 인증 → ECR 로그인 → 빌드·게시 → digest 기록.
# 권한: GitHub에 장기 AWS 키를 두지 않습니다. 게시 후 활성화된 개발 CD만 호출하며 AWS 자원을 생성하지 않습니다.
name: Publish API image
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecr-api-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # 1. 현재 커밋을 기존 CI로 검증합니다. AWS가 비활성이어도 코드 검사는 실행합니다.
  validate:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish API to ECR
    if: vars.ECR_PUBLISH_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      # 2. 값 누락·계정/주소 형식을 인증 전에 검사합니다. AWS commercial partition 기준입니다.
      - name: ECR 설정 확인
        id: image
        shell: bash
        run: |
          set -euo pipefail
          for key in AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY AWS_ECR_PUBLISH_ROLE_ARN; do
            [[ -n "${!key}" ]] || { echo "Missing setting: $key" >&2; exit 1; }
          done
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "name=$registry/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "tag=$registry/$ECR_REPOSITORY:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: OIDC로 ECR 게시 역할 인증
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      # 3. 같은 커밋 태그가 이미 있으면 덮어쓰지 않고 기존 digest를 재사용합니다.
      # ImageNotFound 외 오류는 권한/네트워크 문제일 수 있으므로 빌드로 숨기지 않고 실패시킵니다.
      - name: 기존 이미지 확인
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/tmp/ecr-error); then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -q 'ImageNotFoundException' /tmp/ecr-error; then
            echo 'digest=' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/ecr-error >&2
            exit 1
          fi
      - name: ECR 로그인
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.digest == ''
      # 4. 이미지 플랫폼·소스 라벨·캐시는 유지하고 게시 목적지만 GHCR에서 ECR로 바꿉니다.
      - name: 이미지 빌드·ECR 게시
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ECR이 실제로 반환한 태그 digest가 빌드/재사용 결과와 같은지 확인한 뒤에만 후속 CD를 허용합니다.
      - name: ECR 게시 digest 검증
        env:
          EXPECTED_DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          actual=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=sha-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$actual" == "$EXPECTED_DIGEST" ]] || { echo 'ECR digest mismatch' >&2; exit 1; }
      - name: 게시 결과 기록
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          {
            echo '## ECR 이미지 준비 완료 (서버 배포는 별도)'
            echo "- 커밋: $GITHUB_SHA"
            echo "- 태그: $TAG"
            echo "- 배포 식별자: $IMAGE@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  # 5. 개발 자동 배포: develop push에서 게시·digest 검증 성공한 이미지만 전달합니다.
  # 수동 게시 재실행은 자동 배포하지 않습니다. 발표 배포는 main에서 별도 수동 실행·승인을 거칩니다.
  deploy-dev:
    name: Deploy verified image to development
    needs: publish
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      vars.COMPOSE_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-compose.yml
    with:
      target: aws-dev
      image: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
