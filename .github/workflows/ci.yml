# PR 검사와 다른 워크플로가 재사용하는 API 검증 절차입니다.
name: API CI

# 언제 이 워크플로를 실행할지 정합니다.
on:
  # PR 생성·커밋 추가·재오픈 등에 실행합니다. 현재 대상 브랜치 필터는 없습니다.
  pull_request:
  # GitHub Actions 화면의 Run workflow로 수동 실행할 수 있습니다.
  workflow_dispatch:
  # publish-api.yml / deploy-ecs.yml에서 같은 검사를 다시 호출할 수 있게 합니다.
  workflow_call:

# 이 범위의 GITHUB_TOKEN 권한입니다. job에 permissions가 있으면 그 job은 별도 권한을 사용합니다.
permissions:
  # 저장소 코드를 읽을 수 있습니다. Git push 권한은 부여하지 않습니다.
  contents: read

# 독립 실행 단위입니다. needs가 없는 job끼리는 병렬로 실행할 수 있습니다.
jobs:
  # 코드 품질·타입·테스트 검사 job입니다. Docker 빌드 job과 독립적입니다.
  checks:
    # GitHub 브랜치 보호에 등록한 필수 검사 이름입니다. 이름 변경 시 보호 설정도 확인해야 합니다.
    name: API checks
    # GitHub가 제공하는 임시 Linux 실행 머신입니다. ECS 서버가 아닙니다.
    runs-on: ubuntu-latest

    # 이 job의 run 명령에 공통 적용할 기본 설정입니다.
    defaults:
      run:
        # 쉘 명령을 api/에서 실행합니다. uses 액션의 실행 경로를 바꾸는 설정은 아닙니다.
        working-directory: api

    # 이 job 안에서는 위에서 아래 순서로 실행합니다. 실패하면 보통 다음 단계는 건너뜁니다.
    steps:
      # runner에는 코드가 없으므로 checkout 액션으로 해당 실행의 코드를 가져옵니다.
      - name: 코드 가져오기
        # 직접 작성한 쉘 명령 대신 공개 액션을 실행합니다.
        uses: actions/checkout@v4

      # Python 환경·의존성 관리 도구를 설치합니다. 액션 자체 버전과 uv 버전은 서로 다릅니다.
      - name: uv 설치
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          # 실제 설치할 uv 도구 버전입니다. setup-uv 액션 버전이 아닙니다.
          version: "0.12.15"

      # api/.python-version에 지정한 Python을 설치합니다.
      - name: Python 설치
        run: uv python install

      # uv.lock을 변경하지 않고 잠긴 의존성·개발 도구를 설치합니다. 잠금 불일치는 실패합니다.
      - name: 의존성 설치
        run: uv sync --locked

      # 미사용 import 등 코드 규칙 위반을 검사합니다.
      - name: 린트 검사
        run: uv run --locked ruff check .

      # 서식을 자동 수정하지 않고 규칙과 일치하는지만 검사합니다.
      - name: 포맷 검사
        run: uv run --locked ruff format --check .

      # app 코드의 타입 사용 오류를 검사합니다.
      - name: 타입 검사
        run: uv run --locked mypy app

      # pytest로 테스트를 실행합니다. 외부 DB 시험은 조건 미충족 시 생략될 수 있습니다.
      - name: 단위 테스트
        run: uv run --locked pytest -q

  # API 코드 검사와 병렬로 Dockerfile 빌드를 검증합니다.
  docker-build:
    # 다른 필수 검사 이름입니다. 컨테이너 빌드 가능 여부를 확인합니다.
    name: API Docker build
    # GitHub가 제공하는 임시 Linux 실행 머신입니다. ECS 서버가 아닙니다.
    runs-on: ubuntu-latest

    # 이 job 안에서는 위에서 아래 순서로 실행합니다. 실패하면 보통 다음 단계는 건너뜁니다.
    steps:
      # runner에는 코드가 없으므로 checkout 액션으로 해당 실행의 코드를 가져옵니다.
      - name: 코드 가져오기
        # 직접 작성한 쉘 명령 대신 공개 액션을 실행합니다.
        uses: actions/checkout@v4

      # runner 안에서만 테스트 이미지를 만듭니다. 레지스트리에 올리거나 서비스로 배포하지 않습니다.
      - name: 이미지 빌드 확인
        run: docker build -t presentation-coach-api:check ./api
